services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ee
      POSTGRES_PASSWORD: ee
      POSTGRES_DB: ee
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ee -d ee']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
